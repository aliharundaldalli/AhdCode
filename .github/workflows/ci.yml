name: CI

on:
  push:
    branches: [ main, v2.12-dev, 'release/v2.12.0-rc1' ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    name: Core tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        # internal/build runs in its own dedicated job below because it
        # compiles hundreds of native executables and exceeds 25m when
        # sharing a runner with the rest of the workspace.
        run: |
          go list ./... | grep -v '^ahdcode/internal/build$' | xargs go test -count=1 -timeout 25m

      - name: Run vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check git diff
        run: git diff --check

      - name: Test PWA worker
        run: node --test internal/initweb/pwa_worker_test.cjs

      - name: Build and verify Linux distribution archives
        run: |
          python3 -B tooling/distribution/leak_gate.py --self-test
          python3 -B tooling/distribution/build.py --platform linux --without-bundled-runtimes --without-vsix --output "$RUNNER_TEMP/linux-dist"
          (cd "$RUNNER_TEMP/linux-dist" && sha256sum -c SHA256SUMS.txt)
          mkdir -p "$RUNNER_TEMP/linux-extract" "$RUNNER_TEMP/linux-sqlite"
          tar -xzf "$RUNNER_TEMP/linux-dist/AhdCode-2.12.0-linux-amd64.tar.gz" -C "$RUNNER_TEMP/linux-extract"
          sh "$RUNNER_TEMP/linux-extract/AhdCode-2.12.0-linux-amd64/install.sh" --prefix "$RUNNER_TEMP/ahd-linux-test"
          test "$("$RUNNER_TEMP/ahd-linux-test/bin/ahdcode" version)" = 'AhdCode v2.12.0'
          printf '%s\n' \
            'bring SQLite' \
            'from SQLite bring (Database, SQLiteValue)' \
            'db: Database := SQLite.open("ci.db")' \
            'db.execute("CREATE TABLE items(id INTEGER PRIMARY KEY, name TEXT)")' \
            'db.execute("INSERT INTO items(name) VALUES(?)", [SQLite.fromString("linux-ok")])' \
            'rows: List<Pair<String, SQLiteValue>> := db.query("SELECT name FROM items")' \
            'write(rows[0]["name"].string())' \
            'db.close()' > "$RUNNER_TEMP/linux-sqlite/main.ahd"
          out=$(cd "$RUNNER_TEMP/linux-sqlite" && env -u AHDCODE_BIN -u AHDCODE_SQLITE_RUNTIME "$RUNNER_TEMP/ahd-linux-test/bin/ahdcode" run main.ahd)
          test "$out" = 'linux-ok'
          sh "$RUNNER_TEMP/ahd-linux-test/current/install.sh" --prefix "$RUNNER_TEMP/ahd-linux-test" --uninstall
          test ! -e "$RUNNER_TEMP/ahd-linux-test"

  native-build:
    name: Native build suite
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run internal/build tests
        run: go test -count=1 -timeout 45m ./internal/build

  macos-rc:
    name: macOS ARM64 verification and packaging
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build the native CLI and SQLite helper
        run: |
          go build -trimpath -o "$RUNNER_TEMP/ahdcode" ./cmd/ahdcode
          go build -trimpath -o "$RUNNER_TEMP/ahdsqlite" ./cmd/ahdsqlite
          test "$("$RUNNER_TEMP/ahdcode" version)" = 'AhdCode v2.12.0'
          echo "AHDCODE_BIN=$RUNNER_TEMP/ahdcode" >> "$GITHUB_ENV"
          echo "AHDCODE_SQLITE_RUNTIME=$RUNNER_TEMP/ahdsqlite" >> "$GITHUB_ENV"

      - name: Exercise native Web, HTTPS, PWA and deployment
        run: |
          go test -count=1 -timeout 20m -run 'Test(Check|PrivateAvatar|BasicStarter|PWA|DevHTTPS|DevReload|HTTPNativeAndEvaluator|HTTPErrorPage|PersistentSession|WebSocket|WebPackage|WebAssets|WebPWA|Workspace|Rename|References|ResourceSymlink)' \
            ./cmd/ahdcode ./internal/backend/golang/ahdruntime ./internal/build ./internal/initweb ./internal/packaging ./internal/lsp ./internal/analysis
          node --test internal/initweb/pwa_worker_test.cjs

      - name: Race-test the Web runtime and packager
        run: |
          go test -race -count=1 -timeout 20m -run 'Test(DevHTTPS|HTTPShutdown|PersistentSession|WebSocket|WebPackage|WebAssets|WebPWA)' \
            ./cmd/ahdcode ./internal/backend/golang/ahdruntime ./internal/packaging

      - name: Build and test macOS distribution artifacts (tar.gz, pkg, dmg)
        run: |
          python3 -B tooling/distribution/leak_gate.py --self-test
          python3 -B tooling/distribution/build.py --platform darwin --macos-arch both --without-bundled-runtimes --without-vsix --output "$RUNNER_TEMP/macos-dist"
          AHDCODE_TEST_MACOS_DIST_DIR="$RUNNER_TEMP/macos-dist" python3 -B -m unittest -v tooling/distribution/test_macos_dist.py
          mkdir -p "$HOME/Library/AhdCode/versions/2.9.0/bin" "$HOME/Library/AhdCode/bin" "$HOME/Library/Application Support/ahdcode"
          printf '#!/bin/sh\necho "AhdCode v2.9.0"\n' > "$HOME/Library/AhdCode/versions/2.9.0/bin/ahdcode"
          chmod 0755 "$HOME/Library/AhdCode/versions/2.9.0/bin/ahdcode"
          printf 'AhdCode installer v1\n' > "$HOME/Library/AhdCode/.ahdcode-install"
          ln -sfn versions/2.9.0 "$HOME/Library/AhdCode/current"
          ln -sfn ../current/bin/ahdcode "$HOME/Library/AhdCode/bin/ahdcode"
          printf 'preserve-me\n' > "$HOME/Library/Application Support/ahdcode/keep.txt"
          /usr/sbin/installer -pkg "$RUNNER_TEMP/macos-dist/AhdCode-2.12.0-macos-arm64-unsigned.pkg" -target CurrentUserHomeDirectory
          test -x "$HOME/Library/AhdCode/versions/2.9.0/bin/ahdcode"
          test "$(env -u AHDCODE_BIN -u AHDCODE_SQLITE_RUNTIME "$HOME/Library/AhdCode/bin/ahdcode" version)" = 'AhdCode v2.12.0'
          test "$(readlink "$HOME/Library/AhdCode/current")" = 'versions/2.12.0'
          test "$(grep -c '^# >>> AhdCode PATH >>>$' "$HOME/.zshrc")" = '1'
          sh "$HOME/Library/AhdCode/current/install.sh" --uninstall
          test ! -e "$HOME/Library/AhdCode"
          test "$(cat "$HOME/Library/Application Support/ahdcode/keep.txt")" = 'preserve-me'

      - name: Retain unsigned QA packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/macos-dist/AhdCode-*-unsigned.*
            ${{ runner.temp }}/macos-dist/SHA256SUMS.txt
            ${{ runner.temp }}/macos-dist/release-manifest.json

  windows:
    name: Windows x64 verification and packaging
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build native CLI and SQLite helper
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\ahdcode.exe" ./cmd/ahdcode
          go build -trimpath -o "$env:RUNNER_TEMP\ahdsqlite.exe" ./cmd/ahdsqlite
          $ver = (& "$env:RUNNER_TEMP\ahdcode.exe" version).Trim()
          if ($ver -ne 'AhdCode v2.12.0') { throw "Unexpected version: $ver" }
          "AHDCODE_BIN=$env:RUNNER_TEMP\ahdcode.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AHDCODE_SQLITE_RUNTIME=$env:RUNNER_TEMP\ahdsqlite.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Exercise Windows Web, HTTPS, PWA, packaging and migrations
        run: |
          node --test internal/initweb/pwa_worker_test.cjs
          go test -count=1 -timeout 20m ./tooling/distribution/winsetup ./internal/initweb ./internal/migrate
          go test -count=1 -timeout 20m -run 'Test(Check|PrivateAvatar|BasicStarter|PWA|DevHTTPS|HTTPNativeAndEvaluator|HTTPErrorPage|PersistentSession|WebSocket|WebPackage|WebAssets|WebPWA|Workspace|Rename|References|ResourceSymlink|ResourceCopyRejectsSymlinks|TLSInspectConnectionFailuresAreErrors|DiskInspectReportsConsistentSizes|StudioEnvBootstrapPreservesExisting|HTTPDownloadDestinationRules)' `
            ./cmd/ahdcode ./internal/backend/golang/ahdruntime ./internal/build ./internal/packaging ./internal/lsp ./internal/analysis

      - name: Race-test Windows Web runtime and packaging
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            foreach ($cand in @('C:\msys64\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\Strawberry\c\bin')) {
              if (Test-Path (Join-Path $cand 'gcc.exe')) {
                $env:PATH = "$cand;$env:PATH"
                break
              }
            }
          }
          go test -race -count=1 -timeout 20m -run 'Test(DevHTTPS|HTTPShutdown|PersistentSession|WebSocket|WebPackage|WebAssets|WebPWA)' `
            ./cmd/ahdcode ./internal/backend/golang/ahdruntime ./internal/packaging

      - name: Build and verify Windows x64 installer
        run: |
          $distDir = Join-Path $env:RUNNER_TEMP 'win-dist'
          python -B tooling/distribution/build.py --platform windows --without-bundled-runtimes --without-vsix --output $distDir
          if ($LASTEXITCODE -ne 0) { throw "build.py exited with $LASTEXITCODE" }
          $exe = Join-Path $distDir 'AhdCode-2.12.0-windows-x64.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $env:AHDCODE_WINDOWS_SETUP = $exe
          go test -v -count=1 ./tooling/distribution/winsetup
          $proc = Start-Process -FilePath $exe -ArgumentList '--silent' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installer exited with $($proc.ExitCode)" }
          Remove-Item Env:AHDCODE_BIN -ErrorAction SilentlyContinue
          Remove-Item Env:AHDCODE_SQLITE_RUNTIME -ErrorAction SilentlyContinue
          $installed = Join-Path $env:LOCALAPPDATA 'AhdCode\bin\ahdcode.exe'
          $ver = (& $installed version).Trim()
          if ($ver -ne 'AhdCode v2.12.0') { throw "Unexpected installed version: $ver" }
          $smokeDir = Join-Path $env:RUNNER_TEMP 'win-sqlite'
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $code = @(
            'bring SQLite'
            'from SQLite bring (Database, SQLiteValue)'
            'db: Database := SQLite.open("ci.db")'
            'db.execute("CREATE TABLE items(id INTEGER PRIMARY KEY, name TEXT)")'
            'db.execute("INSERT INTO items(name) VALUES(?)", [SQLite.fromString("win-ok")])'
            'rows: List<Pair<String, SQLiteValue>> := db.query("SELECT name FROM items")'
            'write(rows[0]["name"].string())'
            'db.close()'
          )
          [System.IO.File]::WriteAllLines((Join-Path $smokeDir 'main.ahd'), $code, [System.Text.UTF8Encoding]::new($false))
          Push-Location $smokeDir
          try {
            $out = (& $installed run .\main.ahd).Trim()
            if ($out -ne 'win-ok') { throw "Unexpected SQLite output: $out" }
          } finally {
            Pop-Location
          }

  nested:
    name: Nested helper modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cmd/ahdgraphics, cmd/ahdgui, cmd/ahdplotview, cmd/ahdidentity]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet and test helper module
        run: |
          go -C ${{ matrix.module }} vet ./...
          go -C ${{ matrix.module }} test -count=1 -race -timeout 15m ./...

  targeted-race:
    name: Targeted race coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Race-test concurrent runtime and build parity surfaces
        # The core job already executes every package, including the expensive
        # native build suite. Broad -race ./... recompiles that suite without
        # adding useful coverage. These packages contain the mutable runtime
        # registries, network readers, and evaluator/native parity that the race
        # detector can materially exercise.
        run: |
          go test -race -count=1 -timeout 25m ./internal/backend/golang/ahdruntime/ ./internal/evaluator/
          go test -race -count=1 -timeout 25m -run 'WebSocket|HTTP|SMTP|V210' ./internal/build/

      - name: Race-test packaging and migrations
        run: go test -race -count=1 -timeout 20m ./internal/packaging ./internal/migrate

  mysql:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ahdcode-ci-root
          MYSQL_USER: ahdcode
          MYSQL_PASSWORD: ahdcode-ci-password
          MYSQL_DATABASE: ahdcode_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AHDCODE_TEST_MYSQL_HOST: 127.0.0.1
      AHDCODE_TEST_MYSQL_PORT: "3306"
      AHDCODE_TEST_MYSQL_USERNAME: ahdcode
      AHDCODE_TEST_MYSQL_PASSWORD: ahdcode-ci-password
      AHDCODE_TEST_MYSQL_DATABASE: ahdcode_test
      AHDCODE_TEST_MYSQL_SECURITY: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run live MySQL parity and runtime tests
        shell: bash
        run: |
          go test -v -count=1 -timeout 25m -run 'TestMySQLIntegration' \
            ./internal/backend/golang/ahdruntime ./internal/build | tee mysql-tests.log
          if grep -E -- '--- SKIP: TestMySQLIntegration' mysql-tests.log; then
            echo "MySQL integration tests skipped although a server is configured"
            exit 1
          fi
      - name: Race-test the live MySQL runtime
        run: go test -race -count=1 -timeout 25m -run 'TestMySQLIntegration' ./internal/backend/golang/ahdruntime

  postgresql:
    # The PostgreSQL integration suite needs a live server, so it runs here
    # against a service container and stays out of the hermetic job above.
    # Locally it is opt-in through the same AHDCODE_TEST_POSTGRESQL_* variables.
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ "18", "17" ]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ahdcode
          POSTGRES_PASSWORD: ahdcode-ci-password
          POSTGRES_DB: ahdcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahdcode -d ahdcode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AHDCODE_TEST_POSTGRESQL_HOST: 127.0.0.1
      AHDCODE_TEST_POSTGRESQL_PORT: "5432"
      AHDCODE_TEST_POSTGRESQL_USERNAME: ahdcode
      AHDCODE_TEST_POSTGRESQL_PASSWORD: ahdcode-ci-password
      AHDCODE_TEST_POSTGRESQL_DATABASE: ahdcode_test
      AHDCODE_TEST_POSTGRESQL_SECURITY: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run PostgreSQL tests
        # A server-backed test that skips here would pass silently, so the
        # step fails if any integration test reports a skip.
        shell: bash
        run: |
          go test -v -count=1 -timeout 25m -run 'PostgreSQL' \
            ./internal/backend/golang/ahdruntime/ ./internal/evaluator/ ./internal/build/ | tee postgresql-tests.log
          if grep -E -- '--- SKIP: TestPostgreSQLIntegration[A-Za-z]*( |$)' postgresql-tests.log; then
            echo "PostgreSQL integration tests skipped although a server is configured"
            exit 1
          fi

      - name: Run PostgreSQL runtime tests with the race detector
        run: go test -race -count=1 -timeout 25m -run 'PostgreSQL' ./internal/backend/golang/ahdruntime/
