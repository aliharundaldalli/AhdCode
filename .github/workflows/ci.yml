name: CI

on:
  push:
    branches: [ main, 'release/v2.11.0-rc1' ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    name: Core tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        # internal/build runs in its own dedicated job below because it
        # compiles hundreds of native executables and exceeds 25m when
        # sharing a runner with the rest of the workspace.
        run: |
          go list ./... | grep -v '^ahdcode/internal/build$' | xargs go test -count=1 -timeout 25m

      - name: Run vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check git diff
        run: git diff --check

      - name: Test PWA worker
        if: github.ref_name == 'release/v2.11.0-rc1'
        run: node --test internal/initweb/pwa_worker_test.cjs

  native-build:
    name: Native build suite
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run internal/build tests
        run: go test -count=1 -timeout 45m ./internal/build

  macos-rc:
    name: macOS ARM64 release candidate
    if: github.ref_name == 'release/v2.11.0-rc1'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build the native CLI and SQLite helper
        run: |
          go build -trimpath -o "$RUNNER_TEMP/ahdcode" ./cmd/ahdcode
          go build -trimpath -o "$RUNNER_TEMP/ahdsqlite" ./cmd/ahdsqlite
          test "$("$RUNNER_TEMP/ahdcode" version)" = 'AhdCode v2.11.0'
          echo "AHDCODE_BIN=$RUNNER_TEMP/ahdcode" >> "$GITHUB_ENV"
          echo "AHDCODE_SQLITE_RUNTIME=$RUNNER_TEMP/ahdsqlite" >> "$GITHUB_ENV"

      - name: Exercise native Web, HTTPS, PWA and deployment
        run: |
          go test -count=1 -timeout 20m -run 'Test(BasicStarter|PWA|DevHTTPS|DevReload|HTTPNativeAndEvaluator|HTTPErrorPage|PersistentSession|WebSocket|WebPackage|WebAssets|WebPWA)' \
            ./cmd/ahdcode ./internal/backend/golang/ahdruntime ./internal/build ./internal/initweb ./internal/packaging
          node --test internal/initweb/pwa_worker_test.cjs

      - name: Race-test the Web runtime and packager
        run: |
          go test -race -count=1 -timeout 20m -run 'Test(DevHTTPS|HTTPShutdown|PersistentSession|WebSocket|WebPackage|WebAssets|WebPWA)' \
            ./cmd/ahdcode ./internal/backend/golang/ahdruntime ./internal/packaging

  nested:
    name: Nested helper modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cmd/ahdgraphics, cmd/ahdgui, cmd/ahdplotview, cmd/ahdidentity]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet and test helper module
        run: |
          go -C ${{ matrix.module }} vet ./...
          go -C ${{ matrix.module }} test -count=1 -race -timeout 15m ./...

  targeted-race:
    name: Targeted race coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Race-test concurrent runtime and build parity surfaces
        # The core job already executes every package, including the expensive
        # native build suite. Broad -race ./... recompiles that suite without
        # adding useful coverage. These packages contain the mutable runtime
        # registries, network readers, and evaluator/native parity that the race
        # detector can materially exercise.
        run: |
          go test -race -count=1 -timeout 25m ./internal/backend/golang/ahdruntime/ ./internal/evaluator/
          go test -race -count=1 -timeout 25m -run 'WebSocket|HTTP|SMTP|V210' ./internal/build/

      - name: Race-test packaging and migrations
        if: github.ref_name == 'release/v2.11.0-rc1'
        run: go test -race -count=1 -timeout 20m ./internal/packaging ./internal/migrate

  postgresql:
    # The PostgreSQL integration suite needs a live server, so it runs here
    # against a service container and stays out of the hermetic job above.
    # Locally it is opt-in through the same AHDCODE_TEST_POSTGRESQL_* variables.
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ "18", "17" ]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ahdcode
          POSTGRES_PASSWORD: ahdcode-ci-password
          POSTGRES_DB: ahdcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahdcode -d ahdcode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AHDCODE_TEST_POSTGRESQL_HOST: 127.0.0.1
      AHDCODE_TEST_POSTGRESQL_PORT: "5432"
      AHDCODE_TEST_POSTGRESQL_USERNAME: ahdcode
      AHDCODE_TEST_POSTGRESQL_PASSWORD: ahdcode-ci-password
      AHDCODE_TEST_POSTGRESQL_DATABASE: ahdcode_test
      AHDCODE_TEST_POSTGRESQL_SECURITY: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run PostgreSQL tests
        # A server-backed test that skips here would pass silently, so the
        # step fails if any integration test reports a skip.
        shell: bash
        run: |
          go test -v -count=1 -timeout 25m -run 'PostgreSQL' \
            ./internal/backend/golang/ahdruntime/ ./internal/evaluator/ ./internal/build/ | tee postgresql-tests.log
          if grep -E -- '--- SKIP: TestPostgreSQLIntegration[A-Za-z]*( |$)' postgresql-tests.log; then
            echo "PostgreSQL integration tests skipped although a server is configured"
            exit 1
          fi

      - name: Run PostgreSQL runtime tests with the race detector
        run: go test -race -count=1 -timeout 25m -run 'PostgreSQL' ./internal/backend/golang/ahdruntime/
