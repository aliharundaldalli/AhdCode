name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        # internal/build compiles many native programs and has measured between
        # 415s and 565s on these runners, which leaves no margin under Go's
        # default 10m per-package timeout. The race step below already carries an
        # explicit timeout for the same reason.
        run: go test -count=1 -timeout 25m ./...

      - name: Run vet
        run: go vet ./...

      - name: Test and vet the Graphics window helper
        # cmd/ahdgraphics is its own Go module, so the root ./... patterns do
        # not reach it. Its tests are headless and need no display.
        run: |
          go -C cmd/ahdgraphics vet ./...
          go -C cmd/ahdgraphics test -count=1 -race ./...

      - name: Test and vet the GUI window helper
        # cmd/ahdgui is its own Go module as well; its tests are headless too.
        run: |
          go -C cmd/ahdgui vet ./...
          go -C cmd/ahdgui test -count=1 -race ./...

      - name: Run race tests
        # internal/build compiles many native programs under the race detector.
        # On GitHub runners that package can exceed Go's default 10m timeout.
        run: go test -race -count=1 -timeout 25m -parallel 2 ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check git diff
        run: git diff --check

  postgresql:
    # The PostgreSQL integration suite needs a live server, so it runs here
    # against a service container and stays out of the hermetic job above.
    # Locally it is opt-in through the same AHDCODE_TEST_POSTGRESQL_* variables.
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ "18", "17" ]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ahdcode
          POSTGRES_PASSWORD: ahdcode-ci-password
          POSTGRES_DB: ahdcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahdcode -d ahdcode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AHDCODE_TEST_POSTGRESQL_HOST: 127.0.0.1
      AHDCODE_TEST_POSTGRESQL_PORT: "5432"
      AHDCODE_TEST_POSTGRESQL_USERNAME: ahdcode
      AHDCODE_TEST_POSTGRESQL_PASSWORD: ahdcode-ci-password
      AHDCODE_TEST_POSTGRESQL_DATABASE: ahdcode_test
      AHDCODE_TEST_POSTGRESQL_SECURITY: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run PostgreSQL tests
        # A server-backed test that skips here would pass silently, so the
        # step fails if any integration test reports a skip.
        shell: bash
        run: |
          go test -v -count=1 -timeout 25m -run 'PostgreSQL' \
            ./internal/backend/golang/ahdruntime/ ./internal/evaluator/ ./internal/build/ | tee postgresql-tests.log
          if grep -E -- '--- SKIP: TestPostgreSQLIntegration[A-Za-z]*( |$)' postgresql-tests.log; then
            echo "PostgreSQL integration tests skipped although a server is configured"
            exit 1
          fi

      - name: Run PostgreSQL runtime tests with the race detector
        run: go test -race -count=1 -timeout 25m -run 'PostgreSQL' ./internal/backend/golang/ahdruntime/
